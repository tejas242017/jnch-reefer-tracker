name: JNCH DPD Reefer Tracker

on:
  schedule:
    # Runs at 03:00, 07:00, 11:00, 15:00 UTC (8:30 AM, 12:30 PM, 4:30 PM, 8:30 PM IST)
    - cron: '0 3,7,11,15 * * *'
  workflow_dispatch: # Allows manual run button

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Reefer Tracker
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECEIVER: ${{ secrets.ALERT_RECEIVER }}
        run: |
          python test_real_alert.py

      - name: Commit and Push Updated Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add detected_reefers.csv seen_containers.txt || true
          if git diff --staged --quiet; then
            echo "No new reefer containers to commit."
          else
            git commit -m "Auto-update: Logged new reefer arrivals"
            git push origin main
          fi